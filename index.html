<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Você foi convidado(a) — Um Segredo da Alta Sociedade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0b0a08;
    --ink-2: #16130f;
    --gold: #c8a24d;
    --gold-bright: #e8c877;
    --gold-soft: #a9863f;
    --parchment: #f2e6c9;
    --wine: #4a1116;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: #050403;
    color: var(--parchment);
    font-family:'Cormorant Garamond', serif;
    overflow:hidden;
  }

  /* backdrop behind the invite "card" on wide screens */
  body{
    background:
      radial-gradient(circle at 50% 20%, #241d13 0%, #0a0806 55%, #050403 100%);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #stage{
    position:relative;
    width:100%;
    height:100%;
    max-width:460px;
    max-height:900px;
    aspect-ratio: 9/16;
    background:#000;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(200,162,77,0.35),
      0 0 60px rgba(0,0,0,0.9),
      0 0 120px rgba(120,90,30,0.15);
    border-radius: 6px;
  }

  @media (min-width: 500px){
    #stage{ height:900px; }
  }

  /* ornate inner frame */
  #frame{
    position:absolute; inset:10px;
    border: 1px solid rgba(200,162,77,0.55);
    pointer-events:none;
    z-index:40;
    opacity:1;
    transition: opacity .6s ease;
  }
  #frame::before, #frame::after{
    content:"";
    position:absolute;
    width:26px; height:26px;
    border-top: 1px solid var(--gold);
    border-left: 1px solid var(--gold);
    top:-1px; left:-1px;
  }
  #frame::after{
    top:auto; left:auto; bottom:-1px; right:-1px;
    border-top:none; border-left:none;
    border-bottom: 1px solid var(--gold);
    border-right: 1px solid var(--gold);
  }
  .frame-hide #frame{ opacity:0; }

  .scene{
    position:absolute; inset:0;
    opacity:0;
    visibility:hidden;
    transition: opacity 1s ease;
    z-index:1;
  }
  .scene.active{
    opacity:1;
    visibility:visible;
    z-index:2;
  }

  video, .poster-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---------- COVER SCENE ---------- */
  #scene-cover .veil{
    position:absolute; inset:0;
    background: linear-gradient(180deg,
      rgba(5,4,3,0.35) 0%,
      rgba(5,4,3,0.35) 40%,
      rgba(5,4,3,0.92) 78%,
      rgba(5,4,3,0.98) 100%);
    z-index:2;
  }

  .cover-content{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:3;
    padding: 0 28px 44px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }

  .eyebrow{
    font-family:'Playfair Display', serif;
    font-size:11px;
    letter-spacing:3.5px;
    text-transform:uppercase;
    color: var(--gold-bright);
    margin:0;
    opacity:0.9;
  }

  .script-title{
    font-family:'Mrs Saint Delafield', cursive;
    font-weight:400;
    font-size:56px;
    line-height:1;
    color: var(--parchment);
    margin: 2px 0 0;
    text-shadow: 0 2px 18px rgba(200,162,77,0.25);
  }

  .cover-body{
    font-size:17px;
    line-height:1.5;
    font-style:italic;
    color: rgba(242,230,201,0.88);
    max-width:300px;
    margin: 2px 0 6px;
  }

  .divider{
    width:120px; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 2px 0;
    opacity:0.8;
  }

  /* wax seal button — signature element */
  .seal-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:6px;
    color: var(--parchment);
    font-family:'Playfair Display', serif;
  }

  .seal{
    width:74px; height:74px;
    border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 35% 30%, #7a2027 0%, #55151a 45%, #370d10 100%);
    box-shadow:
      0 4px 10px rgba(0,0,0,0.6),
      inset 0 0 0 1px rgba(200,162,77,0.5),
      inset 0 -6px 10px rgba(0,0,0,0.4),
      inset 0 6px 10px rgba(255,255,255,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .35s ease;
  }
  .seal svg{ width:38px; height:38px; opacity:0.92; }

  .seal-btn:hover .seal{ transform: scale(1.06) rotate(-3deg); }
  .seal-btn:active .seal{ transform: scale(0.96) rotate(2deg); }

  .seal-label{
    font-size:14px;
    letter-spacing:2.2px;
    text-transform:uppercase;
    color: var(--gold-bright);
  }

  /* crack animation on open */
  .seal.cracking{
    animation: crackOpen .7s ease forwards;
  }
  @keyframes crackOpen{
    0%   { transform: scale(1) rotate(0deg); }
    35%  { transform: scale(1.18) rotate(-8deg); }
    60%  { transform: scale(0.9) rotate(6deg); filter:brightness(1.3); }
    100% { transform: scale(1.6) rotate(0deg); opacity:0; filter:brightness(1.6); }
  }

  .cover-fade-out{
    animation: coverFadeOut .8s ease forwards;
  }
  @keyframes coverFadeOut{
    to{ opacity:0; visibility:hidden; }
  }

  /* subtle floating gold motes on cover */
  .motes span{
    position:absolute;
    width:3px; height:3px;
    background: var(--gold-bright);
    border-radius:50%;
    opacity:0;
    filter: drop-shadow(0 0 4px var(--gold-bright));
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float{
    0%{ opacity:0; transform: translateY(0) scale(0.6);}
    15%{ opacity:0.9;}
    100%{ opacity:0; transform: translateY(-160px) scale(1.1);}
  }

  /* ---------- MUTE TOGGLE ---------- */
  .mute-btn{
    position:absolute;
    top:22px; right:22px;
    z-index:50;
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid rgba(200,162,77,0.5);
    background: rgba(5,4,3,0.55);
    color: var(--gold-bright);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    backdrop-filter: blur(2px);
    transition: opacity .4s ease, transform .2s ease;
    opacity:0;
    pointer-events:none;
  }
  .mute-btn.show{ opacity:1; pointer-events:auto; }
  .mute-btn:active{ transform: scale(0.92); }

  /* tap-to-continue hint if browser blocks autoplay-with-sound chain */
  .tap-hint{
    position:absolute;
    left:50%; bottom:34px;
    transform: translateX(-50%);
    z-index:50;
    font-family:'Playfair Display', serif;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--gold-bright);
    background: rgba(5,4,3,0.55);
    border:1px solid rgba(200,162,77,0.5);
    padding:10px 16px;
    border-radius:30px;
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
    white-space:nowrap;
  }
  .tap-hint.show{ opacity:1; pointer-events:auto; cursor:pointer; }

  #stage.no-select{ -webkit-user-select:none; user-select:none; }

  @media (prefers-reduced-motion: reduce){
    .seal-btn:hover .seal{ transform:none; }
    .motes span{ animation:none; opacity:0; }
  }
</style>
</head>
<body>

<div id="stage" class="no-select">

  <!-- SCENE 0 — COVER / CONVITE PARA ABRIR O PRESENTE -->
  <section id="scene-cover" class="scene active">
    <img class="poster-img" src="poster1.jpg" alt="Um presente sobre a mesa">
    <div class="motes">
      <span style="left:18%; animation-delay:.2s;"></span>
      <span style="left:42%; animation-delay:1.8s;"></span>
      <span style="left:68%; animation-delay:.9s;"></span>
      <span style="left:82%; animation-delay:2.6s;"></span>
      <span style="left:30%; animation-delay:3.4s;"></span>
    </div>
    <div class="veil"></div>
    <div class="cover-content">
      <p class="eyebrow">Um bilhete de Lady Whistledown</p>
      <h1 class="script-title">Um segredo aguarda</h1>
      <p class="cover-body">Corre pelos salões da sociedade que um presente foi deixado especialmente para vossa senhoria.</p>
      <div class="divider"></div>
      <button id="btn-open" class="seal-btn" aria-label="Abrir o presente">
        <span class="seal" id="seal">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3C10 5 8 6 6 6c0 3.5 2 6.5 6 9 4-2.5 6-5.5 6-9-2 0-4-1-6-3Z" stroke="#e8c877" stroke-width="1.1" stroke-linejoin="round"/>
            <path d="M12 6v9" stroke="#e8c877" stroke-width="1"/>
          </svg>
        </span>
        <span class="seal-label">Abrir o presente</span>
      </button>
    </div>
  </section>

  <!-- SCENE 1 — ABERTURA DO PRESENTE -->
  <section id="scene-gift" class="scene">
    <video id="video1" src="video_1.mp4" playsinline webkit-playsinline preload="auto"></video>
  </section>

  <!-- SCENE 2 — REVELACAO DA ANIVERSARIANTE -->
  <section id="scene-reveal" class="scene">
    <video id="video2" src="video_2.mp4" playsinline webkit-playsinline preload="auto"></video>
  </section>

  <!-- SCENE 3 — CONVITE (LOOP) -->
  <section id="scene-invite" class="scene">
    <video id="video3" src="video_3.mp4" playsinline webkit-playsinline preload="auto" loop></video>
  </section>

  <div id="frame"></div>
  <button class="mute-btn" id="btn-mute" aria-label="Ativar ou silenciar som">🔊</button>
  <button class="tap-hint" id="tap-hint">Toque para o som ♪</button>
  <video id="bgm" src="bgm_video.mp4" loop playsinline webkit-playsinline preload="auto"
    style="position:absolute; width:2px; height:2px; opacity:0; pointer-events:none; top:0; left:0;"></video>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const sceneCover = document.getElementById('scene-cover');
  const sceneGift = document.getElementById('scene-gift');
  const sceneReveal = document.getElementById('scene-reveal');
  const sceneInvite = document.getElementById('scene-invite');

  const v1 = document.getElementById('video1');
  const v2 = document.getElementById('video2');
  const v3 = document.getElementById('video3');
  const bgm = document.getElementById('bgm');
  bgm.loop = true;

  const btnOpen = document.getElementById('btn-open');
  const seal = document.getElementById('seal');
  const btnMute = document.getElementById('btn-mute');
  const tapHint = document.getElementById('tap-hint');

  let userMuted = false; // tracks user's explicit preference via mute button

  function showMuteControl(){
    btnMute.classList.add('show');
  }

  function updateMuteIcon(){
    const anyMuted = [v1,v2,v3,bgm].some(v => v.muted);
    btnMute.textContent = anyMuted ? '🔇' : '🔊';
  }

  btnMute.addEventListener('click', () => {
    userMuted = !userMuted;
    [v1,v2,v3,bgm].forEach(v => v.muted = userMuted);
    updateMuteIcon();
  });

  function goTo(scene){
    [sceneCover, sceneGift, sceneReveal, sceneInvite].forEach(s => s.classList.remove('active'));
    scene.classList.add('active');
  }

  // attempts to play with sound; falls back to muted playback + shows a tap hint
  async function playScene(video, { loop=false, rate=1 } = {}) {
    video.loop = !!loop;
    video.currentTime = 0;
    video.playbackRate = rate;
    video.muted = userMuted; // respect user's manual choice if they toggled it
    try{
      await video.play();
      showMuteControl();
      updateMuteIcon();
      tapHint.classList.remove('show');
    }catch(err){
      video.muted = true;
      try{
        await video.play();
        showMuteControl();
        updateMuteIcon();
        tapHint.classList.add('show');
      }catch(err2){
        // even muted autoplay blocked; wait for a tap anywhere on stage
        tapHint.classList.add('show');
        const resume = () => {
          video.play().then(() => {
            tapHint.classList.remove('show');
            updateMuteIcon();
          }).catch(()=>{});
          bgm.play().catch(()=>{});
          stage.removeEventListener('click', resume);
        };
        stage.addEventListener('click', resume);
      }
    }
  }

  function openGift(){
    seal.classList.add('cracking');
    sceneCover.classList.add('cover-fade-out');
    stage.classList.add('frame-hide');

    bgm.muted = userMuted;
    bgm.play().then(() => {
      showMuteControl();
      updateMuteIcon();
    }).catch(() => {
      // will retry on the same tap-hint fallback used by the videos
    });

    // Play video 1 in the same synchronous gesture (no setTimeout) —
    // iOS Safari only allows sound to start if play() fires immediately
    // within the click handler, not after a delay.
    goTo(sceneGift);
    playScene(v1, { rate: 0.6 });
  }

  btnOpen.addEventListener('click', openGift, { once:true });

  v1.addEventListener('ended', () => {
    goTo(sceneReveal);
    playScene(v2, { rate: 0.6 });
  });

  v2.addEventListener('ended', () => {
    stage.classList.remove('frame-hide'); // bring the ornate frame back for the invite card
    goTo(sceneInvite);
    playScene(v3, { loop:true });
  });

  // Safety: if a video errors, still advance so the guest isn't stuck
  function skipOnError(video, next){
    video.addEventListener('error', next);
  }
  skipOnError(v1, () => { goTo(sceneReveal); playScene(v2, { rate: 0.6 }); });
  skipOnError(v2, () => { stage.classList.remove('frame-hide'); goTo(sceneInvite); playScene(v3, {loop:true}); });

})();
</script>

</body>
</html>
